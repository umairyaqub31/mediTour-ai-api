info:
  name: upload-image
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/upload/image"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - /Users/macbookpro/Downloads/2021_Facebook_icon 1.png
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
